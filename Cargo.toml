[workspace]
resolver = "3"
members = ["crates/rvow","crates/rvow-base","crates/rvow-core","crates/rvow-gate","crates/rvow-git","crates/rvow-hook","crates/rvow-plan","crates/rvow-repo","crates/rvow-shell","crates/rvow-store","crates/rvow-syntax"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Releases are GitHub-only: the tag push triggers .github/workflows/release.yml,
# which builds and publishes the binaries. No crates.io publishing.
[workspace.metadata.release]
publish = false
push = true
# One consolidated tag for the whole workspace; release.yml triggers on v*.
tag-name = "v{{version}}"

# Local release builds use thin LTO: fat LTO gave no measured hook speed gain and
# took about 4x longer to rebuild. The shipped binaries use the dist profile,
# which keeps fat LTO for a smaller binary.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Optimize every dependency in debug builds, and not the workspace crates:
# the tests spend their CPU in tree-sitter, sha2 and the wasm compiler.
[profile.dev.package."*"]
opt-level = 2
