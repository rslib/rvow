[workspace]
resolver = "3"
members = ["crates/rvow","crates/rvow-core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Releases are GitHub-only: the tag push triggers .github/workflows/release.yml,
# which builds and publishes the binaries. No crates.io publishing.
[workspace.metadata.release]
publish = false
push = true
# One consolidated tag for the whole workspace; release.yml triggers on v*.
tag-name = "v{{version}}"

# The hooks start rvow on every tool call, so the release binary is built for
# size and speed: fat LTO makes it 5% smaller than thin, for a longer build.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

# Optimize every dependency in debug builds, and not the workspace crates:
# the tests spend their CPU in tree-sitter, sha2 and the wasm compiler.
[profile.dev.package."*"]
opt-level = 2
