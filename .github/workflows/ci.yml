name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          rustflags: ""
      - run: cargo fmt --all --check

  ascii:
    name: ASCII-only Rust source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No byte outside printable ASCII, tab and newline
        run: |
          files=$(git ls-files '*.rs')
          # shellcheck disable=SC2086
          if LC_ALL=C grep -nP '[^\t\n -~]' $files; then
            echo "non-ASCII bytes in Rust source"
            exit 1
          fi

  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
      - name: The tests make their own git repositories, so they need an identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch trunk
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/package-lock.json
      - name: The pi audit tests shell out to tsc and node
        run: npm --prefix extensions ci
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: mkdir -p "$RUNNER_TEMP/tests"
      - run: cargo nextest run --locked --no-fail-fast --run-ignored all
        env:
          TMPDIR: ${{ runner.temp }}/tests/
      - name: The tests left no temp files
        run: sh .github/scripts/temp-left.sh "$RUNNER_TEMP/tests"

  musl:
    name: Static build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build as the release does, with warnings as errors
        env:
          RUSTFLAGS: -D warnings
        run: |
          bin=$(.github/scripts/build-musl.sh ${{ matrix.target }} "$RUNNER_TEMP/musl" | tail -n1)
          echo "bin=$bin" >> "$GITHUB_ENV"
      - name: The binary links no shared library and runs
        run: |
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "$bin links shared libraries"
            exit 1
          fi
          "$bin" --version

  quickstart:
    name: Quickstart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
      - name: Install as the README says, into a private root
        run: |
          cargo install --path crates/rvow --locked --root "$RUNNER_TEMP/rvow"
          echo "$RUNNER_TEMP/rvow/bin" >> "$GITHUB_PATH"
      - run: rvow --version
      - run: .github/scripts/quickstart.sh
      - name: rvow install writes the skill, the hooks and the gate
        run: .github/scripts/install.sh
      - name: A second gate rerun is answered from the cache
        run: .github/scripts/rerun_cache.sh

  extensions:
    name: Extensions (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor that extensions/package.json declares in engines.node, and the current LTS.
        node: ["22.19.0", "24"]
    defaults:
      run:
        working-directory: extensions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: extensions/package-lock.json
      - run: npm ci
      # The lockfile fixes pi for a local run; CI tests the newest pi in the range.
      - run: npm update @earendil-works/pi-coding-agent @earendil-works/pi-tui
      - run: npm run lint
      - run: npm run typecheck:pi
      - run: mkdir -p "$RUNNER_TEMP/tests"
      - run: npm run test:pi
        env:
          TMPDIR: ${{ runner.temp }}/tests/
      - name: The pi tests left no temp files
        run: sh ../.github/scripts/temp-left.sh "$RUNNER_TEMP/tests"
      # The mod checks fail in CI without the claude CLI. The newest one, so a host API change shows here first.
      - name: Install the newest Claude Code
        run: npm install -g "@anthropic-ai/claude-code@latest"
      # Only a logged-in load writes the mod's types; without the secret the type check says so and skips.
      - run: npm run typecheck:claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npm run validate:claude
      - run: npm run test:claude
