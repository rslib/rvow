name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          rustflags: ""
      - id: v
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rvow") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-musl.sh builds Linux in a cross image with a full musl C
          # toolchain for ring and the tree-sitter grammars.
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binroot: $RUNNER_TEMP/musl/target
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binroot: $RUNNER_TEMP/musl/target
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            binroot: target
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: runner.os == 'macOS'
        with:
          target: ${{ matrix.target }}
          rustflags: ""
      - name: Build
        if: runner.os == 'Linux'
        run: .github/scripts/build-musl.sh ${{ matrix.target }} "$RUNNER_TEMP/musl"
      - name: Build
        if: runner.os == 'macOS'
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p rvow
      - name: The Linux binary links no shared library
        if: runner.os == 'Linux'
        run: |
          bin="${{ matrix.binroot }}/${{ matrix.target }}/dist/rvow"
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "$bin links shared libraries"
            exit 1
          fi
      - name: The binary runs and reports the version
        run: |
          out=$("${{ matrix.binroot }}/${{ matrix.target }}/dist/rvow" --version)
          echo "$out"
          echo "$out" | grep -q "$VERSION"
      - name: Pack
        run: |
          archive="rvow-${{ matrix.name }}-v$VERSION.tar.gz"
          mkdir -p pkg
          cp "${{ matrix.binroot }}/${{ matrix.target }}/dist/rvow" pkg/rvow
          tar -czf "$archive" -C pkg rvow
          shasum -a 256 "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: rvow-${{ matrix.name }}
          path: rvow-${{ matrix.name }}-v*.tar.gz*

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the archives
        run: |
          cd dist
          ls -l
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 3
          sha256sum -c -- ./*.sha256
      - name: Release notes
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" | tee notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
