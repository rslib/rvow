[package]
name = "rvow"
description = "Hold a coding agent to an accepted plan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only this package rewrites the changelog, so a workspace release dates the
# Unreleased section once. The link list holds either the first-release seed
# (`commits/trunk`) or a compare link; the replacement that fits it runs.
[package.metadata.release]
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: https://github.com/rslib/rvow/compare/v\\S+\\.\\.\\.HEAD", replace = "[Unreleased]: https://github.com/rslib/rvow/compare/v{{version}}...HEAD\n[{{version}}]: https://github.com/rslib/rvow/compare/v{{prev_version}}...v{{version}}", min = 0, max = 1 },
  { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: https://github.com/rslib/rvow/commits/trunk", replace = "[Unreleased]: https://github.com/rslib/rvow/compare/v{{version}}...HEAD\n[{{version}}]: https://github.com/rslib/rvow/releases/tag/v{{version}}", min = 0, max = 1 },
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rvow-core = { path = "../rvow-core" }
rvow-daemon = { path = "../rvow-daemon" }
rvow-hook = { path = "../rvow-hook" }
rvow-proto = { path = "../rvow-proto" }
serde_json = "1.0.151"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
