[package]
name = "rvow-hook"
description = "The logic behind the harness hooks: the rules, the denials and the state a session keeps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
globset = "0.4.20"
rvow-base = { path = "../rvow-base" }
rvow-core = { path = "../rvow-core" }
rvow-git = { path = "../rvow-git" }
rvow-plan = { path = "../rvow-plan" }
rvow-shell = { path = "../rvow-shell" }
rvow-store = { path = "../rvow-store" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
