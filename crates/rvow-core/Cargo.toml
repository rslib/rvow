[package]
name = "rvow-core"
description = "Library behind the rvow command line: plans, vows, proof and the gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
globset = "0.4.20"
hmac = "0.13.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = "1.1.6"
tree-sitter = { version = "0.27.1", features = ["wasm"] }
ureq = "3.4.2"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
