[package]
name = "rvow-core"
description = "Library behind the rvow command line: plans, vows, proof and the gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
globset = "0.4.21"
rvow-base = { path = "../rvow-base" }
rvow-gate = { path = "../rvow-gate" }
rvow-git = { path = "../rvow-git" }
rvow-plan = { path = "../rvow-plan" }
rvow-repo = { path = "../rvow-repo" }
rvow-shell = { path = "../rvow-shell" }
rvow-store = { path = "../rvow-store" }
rvow-syntax = { path = "../rvow-syntax" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
