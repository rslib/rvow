[package]
name = "rvow-syntax"
description = "The tree-sitter grammars, the canonical syntax form and the guards that read a source file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rvow-base = { path = "../rvow-base" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
tree-sitter = { version = "0.27.1", features = ["wasm"] }
ureq = "3.4.2"

[dev-dependencies]
rvow-git = { path = "../rvow-git" }
